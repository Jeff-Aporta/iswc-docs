<!DOCTYPE html>
<html lang="es" class="theme-dark" data-theme="dark" data-palette="contapyme">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sw-doc-reload · preview</title>
  <script src="../preview-boot.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Jeff-Aporta/is-webcomponents@3c722aca9579cb2f764c026c6385685c1603e789/dist/cdn/is-base.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Jeff-Aporta/is-webcomponents@3c722aca9579cb2f764c026c6385685c1603e789/dist/cdn/palettes.min.css">
  <script type="module" src="https://cdn.jsdelivr.net/gh/Jeff-Aporta/is-webcomponents@3c722aca9579cb2f764c026c6385685c1603e789/dist/cdn/all.min.js"></script>
  <link rel="stylesheet" href="../styles/preview.css">
</head>
<body>
  <main class="preview"></main>
  <iswc-toast placement="bottom-end"></iswc-toast>
  <p id="eco" style="padding:1rem;font:0.875rem/1.4 system-ui"></p>

  <script type="module">
    import '../../dist/cdn/components/sw/sw-doc-reload.js';
    import { caso, montar } from '../preview-kit.js';

    const eco = document.getElementById('eco');
    const btn = document.createElement('sw-doc-reload');
    btn.addEventListener('sw-doc-reload', () => {
      eco.textContent = 'Emitió sw-doc-reload. sw-app / sw-minidoc recargan con force (cache 24 h invalidado).';
    });

    montar('sw-doc-reload', 'Actualiza el JSON del documento desde la API. Solo icono; invalida el cache local de 24 h.', [
      caso('Icono', 'Dispara sw-doc-reload (composed). Quien carga el documento es el driver.', btn),
    ]);
  </script>
</body>
</html>
