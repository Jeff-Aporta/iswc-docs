<!DOCTYPE html>
<html lang="es" class="theme-dark" data-theme="dark" data-palette="contapyme">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>docs-doc-reload · preview</title>
  <script src="../preview-boot.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Jeff-Aporta/is-webcomponents@eab3227d6a0666bcb2c1f053901c14effb02ca13/dist/cdn/is-base.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Jeff-Aporta/is-webcomponents@eab3227d6a0666bcb2c1f053901c14effb02ca13/dist/cdn/palettes.min.css">
  <script type="module">
    const { ISWebComponentsLoader: L } = await import('https://cdn.jsdelivr.net/gh/Jeff-Aporta/is-webcomponents@eab3227d6a0666bcb2c1f053901c14effb02ca13/dist/cdn/core/loader.min.js');
    const { DOCS_KIT_TAGS } = await import('../../dist/cdn/js/kit-tags.js');
    await L.load(...DOCS_KIT_TAGS);
  </script>
  <link rel="stylesheet" href="../styles/preview.css">
</head>
<body>
  <main class="preview"></main>
  <iswc-toast placement="bottom-end"></iswc-toast>
  <p id="eco" style="padding:1rem;font:0.875rem/1.4 system-ui"></p>

  <script type="module">
    import '../../dist/cdn/components/docs/docs-doc-reload.js';
    import { caso, montar } from '../preview-kit.js';

    const eco = document.getElementById('eco');
    const btn = document.createElement('docs-doc-reload');
    btn.addEventListener('docs-doc-reload', () => {
      eco.textContent = 'Emitió docs-doc-reload. docs-app / docs-minidoc recargan con force (cache 24 h invalidado).';
    });

    montar('docs-doc-reload', 'Actualiza el JSON del documento desde la API. Solo icono; invalida el cache local de 24 h.', [
      caso('Icono', 'Dispara docs-doc-reload (composed). Quien carga el documento es el driver.', btn),
    ]);
  </script>
</body>
</html>
