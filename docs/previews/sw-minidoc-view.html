<!DOCTYPE html>
<html lang="es" class="theme-dark" data-theme="dark" data-palette="contapyme">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sw-minidoc-view · preview</title>
  <script src="../preview-boot.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Jeff-Aporta/is-webcomponents@3c722aca9579cb2f764c026c6385685c1603e789/dist/cdn/is-base.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Jeff-Aporta/is-webcomponents@3c722aca9579cb2f764c026c6385685c1603e789/dist/cdn/palettes.min.css">
  <script type="module" src="https://cdn.jsdelivr.net/gh/Jeff-Aporta/is-webcomponents@3c722aca9579cb2f764c026c6385685c1603e789/dist/cdn/all.min.js"></script>
  <link rel="stylesheet" href="../styles/preview.css">
</head>
<body>
  <main class="preview"></main>
  <iswc-toast placement="bottom-end"></iswc-toast>

  <script type="module">
    import '../../dist/cdn/components/sw/sw-minidoc-view.js';
    import { crear, caso, montar } from '../preview-kit.js';

    const spec = {
      info: { title: 'Demo API', version: '1.0.0' },
      tags: [{ name: 'Tareas', description: 'Alta y consulta de tareas' }],
      paths: {},
    };

    const op = {
      path: '/v2/query/video_generation',
      method: 'get',
      operationId: 'listTasks',
      summary: 'List Tasks',
      description: 'Lista las tareas de los últimos 7 días con paginación. Admite filtrar por estado, id de tarea, modelo y tipo.',
      tags: ['Tareas'],
      parameters: [
        { name: 'page_num', in: 'query', required: true, description: 'Número de página, empezando en 1.', schema: { type: 'integer', default: 1 } },
        { name: 'page_size', in: 'query', description: 'Elementos por página. Máximo 100.', schema: { type: 'integer', default: 20 } },
        { name: 'status', in: 'query', description: 'Filtra por estado de la tarea.', schema: { type: 'string', enum: ['queued', 'running', 'succeeded', 'failed'] } },
      ],
      responses: {
        200: { description: 'Listado', content: { 'application/json': { example: { items: [{ id: '424635601932571', status: 'succeeded', duration: 5 }], total: 1 } } } },
        400: { description: 'Petición inválida', content: { 'application/json': { example: { error: 'page_num debe ser >= 1' } } } },
        401: { description: 'Sin autorización', content: { 'application/json': { example: { error: 'token ausente o caducado' } } } },
        429: { description: 'Demasiadas peticiones', content: { 'application/json': { example: { error: 'límite por minuto superado' } } } },
      },
    };

    montar('sw-minidoc-view', 'La operación entera como página de manual: título, barra de endpoint, autorización y parámetros agrupados por dónde viajan. Nada plegado — el driver ya filtró a una sola operación.', [
      caso('Operación completa', 'Con autorización y tres parámetros de consulta, uno con enum.',
        crear('sw-minidoc-view', { op, spec, grupo: 'Tareas', serverBase: 'https://api.demo.io', authEnabled: true, docMd: '' })),
      caso('Con notas', 'El Markdown de la operación se pinta al final, tras los parámetros.',
        crear('sw-minidoc-view', { op, spec, grupo: 'Tareas', serverBase: 'https://api.demo.io', authEnabled: false, docMd: '## Límites\n\nMáximo **100** elementos por página.' })),
      caso('Sin selección', 'Invita a elegir en el índice en vez de dejar la columna en blanco.',
        crear('sw-minidoc-view', { op: null, spec: null, grupo: '', serverBase: '', authEnabled: false, docMd: '' })),
    ]);
  </script>
</body>
</html>
