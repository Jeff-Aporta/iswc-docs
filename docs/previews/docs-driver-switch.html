<!DOCTYPE html>
<html lang="es" class="theme-dark" data-theme="dark" data-palette="contapyme">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>docs-driver-switch · preview</title>
  <script src="../preview-boot.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Jeff-Aporta/is-webcomponents@eab3227d6a0666bcb2c1f053901c14effb02ca13/dist/cdn/is-base.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Jeff-Aporta/is-webcomponents@eab3227d6a0666bcb2c1f053901c14effb02ca13/dist/cdn/palettes.min.css">
  <script type="module">
    const { ISWebComponentsLoader: L } = await import('https://cdn.jsdelivr.net/gh/Jeff-Aporta/is-webcomponents@eab3227d6a0666bcb2c1f053901c14effb02ca13/dist/cdn/core/loader.min.js');
    const { DOCS_KIT_TAGS } = await import('../../dist/cdn/js/kit-tags.js');
    await L.load(...DOCS_KIT_TAGS);
  </script>
  <link rel="stylesheet" href="../styles/preview.css">
</head>
<body>
  <main class="preview"></main>
  <iswc-toast placement="bottom-end"></iswc-toast>

  <script type="module">
    import '../../dist/cdn/components/docs/docs-driver-switch.js';
    import { caso, montar } from '../preview-kit.js';
    import { DRIVERS } from '../../dist/cdn/js/driver.js';

    const eco = document.createElement('p');
    eco.style.cssText = 'margin:0;color:var(--is-color-text-2);font-size:.9375rem';
    eco.textContent = 'Sin cambios todavia.';

    const sel = document.createElement('docs-driver-switch');
    sel.addEventListener('docs-driver-change', (e) => {
      eco.textContent = 'Emitio docs-driver-change con driver=' + e.detail.driver + '. Quien monta el driver es docs-viewer, no este selector.';
    });

    montar('docs-driver-switch', 'Selector de presentacion. Vive en la cabecera de los dos drivers, a la izquierda del conmutador de tema. No monta nada: escribe la preferencia y emite docs-driver-change.', [
      caso('Selector', 'Opciones: ' + DRIVERS.map((d) => d.label).join(' / ') + '.', sel),
      caso('Que emite', 'El evento sube atravesando el shadow hasta docs-viewer, que es quien reemplaza el driver montado.', eco),
    ]);
  </script>
</body>
</html>
