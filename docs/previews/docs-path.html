<!DOCTYPE html>

</head>
<body>
  <main class="preview"></main>
  <iswc-toast placement="bottom-end"></iswc-toast>

  <script type="module">
    import '../../dist/cdn/components/docs/docs-path.js';
    import { crear, caso, montar, registrarEventos } from '../preview-kit.js';

    const rutas = [
      '/tercero',
      '/tercero/{itercero}',
      '/empresa/{iempresa}/tercero/{itercero}/documento',
      '/system/swagger/config.json',
    ];

    const lista = () => {
      const div = document.createElement('div');
      div.style.cssText = 'display:grid;gap:.4rem';
      div.append(...rutas.map((p) => crear('docs-path', { path: p })));
      return div;
    };

    montar('docs-path', 'Ruta con los {parÃ¡metros} resaltados: distinguir el segmento variable del literal es lo que hace escaneable una lista de rutas parecidas.', [
      caso('Rutas tÃ­picas', null, lista()),
      caso('Ruta muy larga', 'Se recorta con ellipsis en vez de romper el layout de la fila.', (() => {
        const wrap = document.createElement('div');
        wrap.style.cssText = 'max-width:18rem;border:1px dashed currentColor;padding:.4rem;border-radius:.4rem';
        wrap.append(crear('docs-path', { path: '/empresa/{iempresa}/tercero/{itercero}/documento/{idocumento}/anexo/{ianexo}' }));
        return wrap;
      })()),
    ]);
  </script>
</body>
</html>
