<!DOCTYPE html>
<html lang="es" class="theme-dark" data-theme="dark" data-palette="contapyme">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sw-viewer · preview</title>
  <script src="../preview-boot.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Jeff-Aporta/is-webcomponents@eab3227d6a0666bcb2c1f053901c14effb02ca13/dist/cdn/is-base.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Jeff-Aporta/is-webcomponents@eab3227d6a0666bcb2c1f053901c14effb02ca13/dist/cdn/palettes.min.css">
  <script type="module">
    const { ISWebComponentsLoader: L } = await import('https://cdn.jsdelivr.net/gh/Jeff-Aporta/is-webcomponents@eab3227d6a0666bcb2c1f053901c14effb02ca13/dist/cdn/core/loader.min.js');
    const { SW_KIT_TAGS } = await import('../../dist/cdn/js/kit-tags.js');
    await L.load(...SW_KIT_TAGS);
  </script>
  <link rel="stylesheet" href="../styles/preview.css">
</head>
<body>
  <main class="preview"></main>
  <iswc-toast placement="bottom-end"></iswc-toast>

  <script type="module">
    import '../../dist/cdn/components/sw/sw-viewer.js';
    import { caso, montar } from '../preview-kit.js';
    import { DRIVERS, readDriver } from '../../dist/cdn/js/driver.js';

    // La envoltura monta un driver de verdad, y sin servidor detras cada uno ensena su estado
    // de error. Eso es justo lo que hay que poder ver aqui: que el conmutador cambia la vista.
    const visor = document.createElement('sw-viewer');
    visor.setAttribute('conn', JSON.stringify({ apiBase: location.origin + '/api' }));
    visor.style.cssText = 'display:block;min-height:60vh;border:1px solid var(--is-color-border);border-radius:12px;overflow:hidden;position:relative';

    const resumen = document.createElement('p');
    resumen.style.cssText = 'margin:0;color:var(--is-color-text-2);font-size:.9375rem';
    resumen.textContent =
      'Driver activo al cargar: ' + readDriver() + '. Disponibles: ' +
      DRIVERS.map((d) => d.id + ' (' + d.label + ')').join(', ') + '.';

    montar('sw-viewer', 'Envoltura de los dos drivers. Saca un selector fijo abajo a la izquierda para cambiar de presentacion en caliente, y recuerda la eleccion en ?driver= y en localStorage. El selector no vive dentro de ningun driver: es una preferencia del lector, por encima de los dos.', [
      caso('Que driver esta activo', 'Se resuelve de la URL, luego de la preferencia guardada, luego el de por defecto.', resumen),
      caso('Conmutador en vivo', 'Cambiar la vista destruye y recrea el driver; la operacion abierta y el servidor viajan por la URL, asi que la vista nueva aterriza donde estaba la anterior.', visor),
    ]);
  </script>
</body>
</html>
