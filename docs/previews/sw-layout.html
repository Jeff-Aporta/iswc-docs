<!DOCTYPE html>
<html lang="es" class="theme-dark" data-theme="dark" data-palette="contapyme">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sw-layout · preview</title>
  <script src="../preview-boot.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Jeff-Aporta/is-webcomponents@eab3227d6a0666bcb2c1f053901c14effb02ca13/dist/cdn/is-base.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Jeff-Aporta/is-webcomponents@eab3227d6a0666bcb2c1f053901c14effb02ca13/dist/cdn/palettes.min.css">
  <script type="module">
    const { ISWebComponentsLoader: L } = await import('https://cdn.jsdelivr.net/gh/Jeff-Aporta/is-webcomponents@eab3227d6a0666bcb2c1f053901c14effb02ca13/dist/cdn/core/loader.min.js');
    const { SW_KIT_TAGS } = await import('../../dist/cdn/js/kit-tags.js');
    await L.load(...SW_KIT_TAGS);
  </script>
  <link rel="stylesheet" href="../styles/preview.css">
</head>
<body>
  <main class="preview"></main>
  <iswc-toast placement="bottom-end"></iswc-toast>

  <script type="module">
    import '../../dist/cdn/components/sw/sw-layout.js';
    import { caso, montar } from '../preview-kit.js';

    const zona = (texto, fondo) => {
      const d = document.createElement('div');
      d.style.cssText = 'padding:1rem;font-size:.875rem;color:var(--is-color-text-2);background:' + fondo;
      d.textContent = texto;
      return d;
    };

    const layout = document.createElement('sw-layout');
    layout.style.cssText = 'display:block;height:26rem;border:1px solid var(--is-color-border);border-radius:12px;overflow:hidden';

    const cab = zona('Cabecera del driver', 'transparent');
    cab.slot = 'cabecera';
    const izq = zona('Indice de endpoints. Arrastra el divisor para ensancharlo.', 'transparent');
    izq.slot = 'inicio';
    const centro = zona('Contenido: la operacion abierta, leida de arriba abajo.', 'transparent');
    centro.slot = 'centro';
    const der = zona('Peticion y respuesta. En pantalla estrecha este es el primero que pasa a cajon.', 'transparent');
    der.slot = 'fin';
    layout.append(cab, izq, centro, der);

    montar('sw-layout', 'Armazon de tres zonas con dos divisores arrastrables. Los laterales quedan pegados a los bordes: el ancho lo decide quien arrastra. Al estrechar, primero pasa a cajon el panel de codigo y despues el indice — el codigo es consulta, el indice es navegacion, y sin el no se puede ni cambiar de endpoint.', [
      caso('Tres zonas', 'Arrastra los divisores; el ancho elegido sobrevive a recargar (storage-key).', layout),
    ]);
  </script>
</body>
</html>
