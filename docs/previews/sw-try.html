  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Jeff-Aporta/is-webcomponents@eab3227d6a0666bcb2c1f053901c14effb02ca13/dist/cdn/palettes.min.css">
  <script type="module">
    const { ISWebComponentsLoader: L } = await import('https://cdn.jsdelivr.net/gh/Jeff-Aporta/is-webcomponents@eab3227d6a0666bcb2c1f053901c14effb02ca13/dist/cdn/core/loader.min.js');

<body>

  <script type="module">
    import '../../dist/cdn/components/sw/sw-try.js';
    import { crear, caso, montar, registrarEventos } from '../preview-kit.js';

    const spec = { servers: [{ url: 'https://httpbin.org' }], components: { securitySchemes: { Bearer: { type: 'http', scheme: 'bearer' } } } };

    const opGet = {
      path: '/get', method: 'get', operationId: 'listar', summary: 'Listar',
      parameters: [
        { name: 'search', in: 'query', description: 'Texto libre.', schema: { type: 'string' }, example: 'insoft' },
        { name: 'limit', in: 'query', schema: { type: 'integer', default: 25 } },
      ],
    };

    const opPost = {
      path: '/post', method: 'post', operationId: 'crear', summary: 'Crear',
      requestBody: { required: true, content: { 'application/json': { example: { nombre: 'InSoft S.A.S.' } } } },
    };

    const opDelete = {
      path: '/delete', method: 'delete', operationId: 'eliminar', summary: 'Eliminar',
      security: [{ Bearer: [] }],
    };

    montar('sw-try', 'Arma la peticiÃ³n, la ejecuta y enseÃ±a la respuesta. Es el Ãºnico componente que no repinta entero en cada cambio: escribir en un parÃ¡metro le quitarÃ­a el foco al campo.', [
      caso('GET contra httpbin', 'Pulsa Ejecutar: la peticiÃ³n sale de verdad.',
        crear('sw-try', { op: opGet, spec, serverBase: 'https://httpbin.org', authEnabled: false })),
      caso('POST con cuerpo', 'Los mÃ©todos que escriben piden confirmaciÃ³n antes de dispararse.',
        crear('sw-try', { op: opPost, spec, serverBase: 'https://httpbin.org', authEnabled: false })),
      caso('DELETE que exige JWT', 'Sin sesiÃ³n emite sw-need-login en vez de lanzar una peticiÃ³n condenada a 401.',
        (() => {
          const nodo = crear('sw-try', { op: opDelete, spec, serverBase: 'https://httpbin.org', authEnabled: true });
          const log = registrarEventos(nodo, ['sw-need-login']);
          const wrap = document.createElement('div');
          wrap.style.cssText = 'display:grid;gap:.6rem';
          wrap.append(nodo, log);
          return wrap;
        })()),
    ]);
  </script>
