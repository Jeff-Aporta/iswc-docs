<!DOCTYPE html>
<html lang="es" class="theme-dark" data-theme="dark" data-palette="contapyme">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>docs-minidoc-code · preview</title>
  <script src="../preview-boot.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Jeff-Aporta/is-webcomponents@eab3227d6a0666bcb2c1f053901c14effb02ca13/dist/cdn/is-base.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Jeff-Aporta/is-webcomponents@eab3227d6a0666bcb2c1f053901c14effb02ca13/dist/cdn/palettes.min.css">
  <script type="module">
    const { ISWebComponentsLoader: L } = await import('https://cdn.jsdelivr.net/gh/Jeff-Aporta/is-webcomponents@eab3227d6a0666bcb2c1f053901c14effb02ca13/dist/cdn/core/loader.min.js');
    const { DOCS_KIT_TAGS } = await import('../../dist/cdn/js/kit-tags.js');
    await L.load(...DOCS_KIT_TAGS);
  </script>
  <link rel="stylesheet" href="../styles/preview.css">
</head>
<body>
  <main class="preview"></main>
  <iswc-toast placement="bottom-end"></iswc-toast>

  <script type="module">
    import '../../dist/cdn/components/docs/docs-minidoc-code.js';
    import { crear, caso, montar } from '../preview-kit.js';

    const spec = {
      info: { title: 'Demo API', version: '1.0.0' },
      tags: [{ name: 'Tareas', description: 'Alta y consulta de tareas' }],
      paths: {},
    };

    const op = {
      path: '/v2/query/video_generation',
      method: 'get',
      operationId: 'listTasks',
      summary: 'List Tasks',
      description: 'Lista las tareas de los últimos 7 días con paginación. Admite filtrar por estado, id de tarea, modelo y tipo.',
      tags: ['Tareas'],
      parameters: [
        { name: 'page_num', in: 'query', required: true, description: 'Número de página, empezando en 1.', schema: { type: 'integer', default: 1 } },
        { name: 'page_size', in: 'query', description: 'Elementos por página. Máximo 100.', schema: { type: 'integer', default: 20 } },
        { name: 'status', in: 'query', description: 'Filtra por estado de la tarea.', schema: { type: 'string', enum: ['queued', 'running', 'succeeded', 'failed'] } },
      ],
      responses: {
        200: { description: 'Listado', content: { 'application/json': { example: { items: [{ id: '424635601932571', status: 'succeeded', duration: 5 }], total: 1 } } } },
        400: { description: 'Petición inválida', content: { 'application/json': { example: { error: 'page_num debe ser >= 1' } } } },
        401: { description: 'Sin autorización', content: { 'application/json': { example: { error: 'token ausente o caducado' } } } },
        429: { description: 'Demasiadas peticiones', content: { 'application/json': { example: { error: 'límite por minuto superado' } } } },
      },
    };

    montar('docs-minidoc-code', 'Columna derecha del driver minidoc: la petición cURL arriba y la respuesta abajo, con una pestaña por código de estado. El token nunca se incrusta en la muestra — se deja el placeholder.', [
      caso('Con autorización', 'La cabecera Authorization aparece porque la operación la exige.',
        crear('docs-minidoc-code', { op, spec, serverBase: 'https://api.demo.io', requiereBearer: true })),
      caso('Endpoint público', 'Sin bearer, la muestra queda a la petición mínima.',
        crear('docs-minidoc-code', { op, spec, serverBase: 'https://api.demo.io', requiereBearer: false })),
      caso('Sin operación', 'Estado vacío: no pinta paneles en vez de pintarlos huecos.',
        crear('docs-minidoc-code', { op: null, spec: null, serverBase: '', requiereBearer: false })),
    ]);
  </script>
</body>
</html>
